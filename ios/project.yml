name: LumaNox
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
packages:
  Argon2Swift:
    url: https://github.com/tmthecoder/Argon2Swift.git
    branch: main
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    from: "5.14.0"
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "11.15.0"
options:
  bundleIdPrefix: com.xpx
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: J9A96K6YJ2
    CODE_SIGN_STYLE: Automatic
targets:
  LumaNox:
    type: application
    platform: iOS
    sources:
      - path: LumaNox
        excludes:
          - "**/.DS_Store"
          - "**/GoogleService-Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xpx.vault
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: LumaNox
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "LumaNox needs camera access for private capture and optional intruder alert photos."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "LumaNox needs microphone access to record private videos."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "LumaNox needs photo library access to import media into your vault."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "LumaNox needs permission to export photos and videos to the LumaNox album in Photos."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "LumaNox uses Face ID to unlock your vault."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: LumaNox/Supporting/Info.plist
        INFOPLIST_KEY_REVENUECAT_API_KEY: $(REVENUECAT_API_KEY)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.2.0
        DEVELOPMENT_LANGUAGE: zh-Hans
        SWIFT_EMIT_LOC_STRINGS: YES
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    dependencies:
      - package: Argon2Swift
      - package: RevenueCat
        product: RevenueCat
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAnalyticsCore
      - package: Firebase
        product: FirebaseCrashlytics
      - sdk: Photos.framework
      - sdk: PhotosUI.framework
      - sdk: LocalAuthentication.framework
      - sdk: AVFoundation.framework
      - sdk: Vision.framework
      - sdk: CryptoKit.framework
      - sdk: WebKit.framework
    postBuildScripts:
      - name: Bundle Firebase Config
        basedOnDependencyAnalysis: false
        script: |
          set -e
          CANDIDATES=(
            "${SRCROOT}/LumaNox/Supporting/GoogleService-Info.plist"
            "${SRCROOT}/LumaNox/GoogleService-Info.plist"
          )
          DESTINATION="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
          for candidate in "${CANDIDATES[@]}"; do
            if [ -f "${candidate}" ]; then
              mkdir -p "$(dirname "${DESTINATION}")"
              cp "${candidate}" "${DESTINATION}"
              echo "Bundled Firebase config from ${candidate}"
              exit 0
            fi
          done
          echo "Skipping Firebase config bundle: GoogleService-Info.plist is not available."
      - name: Upload Firebase Crashlytics dSYMs
        basedOnDependencyAnalysis: false
        script: |
          set -e
          if [ "${CONFIGURATION}" = "Debug" ]; then
            echo "Skipping Firebase Crashlytics dSYM upload for Debug builds."
            exit 0
          fi
          GOOGLE_SERVICE_INFO="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
          CRASHLYTICS_RUN="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          if [ ! -x "${CRASHLYTICS_RUN}" ]; then
            CRASHLYTICS_RUN="${SRCROOT}/build/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          fi
          if [ -f "${GOOGLE_SERVICE_INFO}" ] && [ -x "${CRASHLYTICS_RUN}" ]; then
            "${CRASHLYTICS_RUN}"
          else
            echo "Skipping Firebase Crashlytics dSYM upload: GoogleService-Info.plist or Crashlytics/run is not available."
          fi
  LumaNoxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LumaNoxTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xpx.vault.tests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: LumaNox
    hostApplication: LumaNox
schemes:
  LumaNox:
    build:
      targets:
        LumaNox: all
    run:
      config: Debug
      storeKitConfiguration: LumaNox/Config/LumaNox.storekit
    test:
      config: Debug
      targets:
        - LumaNoxTests
